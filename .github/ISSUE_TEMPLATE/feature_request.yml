name: Feature request
description: Propose a change to the protocol, the helper or the skill.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agents or humans cannot do today, with a concrete scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you want. Say whether it changes the wire format (protocol version).
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Effect on the loop guard, depth limit, fan-out cap, scope or the threat model in docs/SECURITY.md.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
