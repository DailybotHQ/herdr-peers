name: release

# An annotated vX.Y.Z tag publishes a GitHub release whose notes come from
# CHANGELOG.md and whose SHA256SUMS covers the shipped files. A tag with a
# pre-release suffix (v1.2.3-rc.1) is published as a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify the tag (annotated, vX.Y.Z, matches the shipped version)
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag || {
            echo "::error::${TAG} is a lightweight tag; releases need an annotated tag"; exit 1; }
          echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          version="${TAG#v}"
          grep -qx "version: \"${version}\"" skills/herdr-peers/SKILL.md || {
            echo "::error::SKILL.md version does not match ${TAG}"; exit 1; }
          bin/herdr-peers --version | grep -q "^herdr-peers ${version} " || {
            echo "::error::helper --version does not match ${TAG}"; exit 1; }

      - name: Public hygiene and full suite
        run: |
          bash scripts/check-public-hygiene.sh
          bash tests/run.sh

      - name: Build notes and SHA256SUMS
        run: bash scripts/release-assets.sh "${TAG}" "${RUNNER_TEMP}/release"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/release"
          sha256sum --check --quiet "$dir/SHA256SUMS"
          pre=()
          case "${TAG}" in *-*) pre=(--prerelease) ;; esac
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "$dir/SHA256SUMS" --clobber
          else
            gh release create "${TAG}" "$dir/SHA256SUMS" --verify-tag \
              --title "${TAG}" --notes-file "$dir/RELEASE_NOTES.md" "${pre[@]}"
          fi
