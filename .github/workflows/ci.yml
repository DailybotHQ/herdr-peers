name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Public-hygiene check (tracked files, no network)
        run: bash scripts/check-public-hygiene.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shellcheck_asset: linux.x86_64
            shellcheck_sha256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          - os: macos-latest
            shellcheck_asset: darwin.aarch64
            shellcheck_sha256: 339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }} (pinned, checksum-verified)
        run: |
          set -euo pipefail
          name="shellcheck-${SHELLCHECK_VERSION}.${{ matrix.shellcheck_asset }}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$name" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/$name"
          echo "${{ matrix.shellcheck_sha256 }}  $RUNNER_TEMP/$name" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Full suite (sandboxed, no network, fake herdr)
        run: bash tests/run.sh
